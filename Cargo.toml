[package]
name = "chroma-panel"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["wayland","x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
zbus = "5.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.dev]
debug = 0
